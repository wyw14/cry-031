services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: volunteer
      POSTGRES_USER: volunteer
      POSTGRES_PASSWORD: volunteer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volunteer -d volunteer"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  api:
    build: .
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      STORE_MODE: postgres
      DATABASE_URL: postgres://volunteer:volunteer@postgres:5432/volunteer?sslmode=disable
      SEED_DEMO: "true"
      ATTACHMENT_DIR: /app/var/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/var/uploads

  web:
    build: ./web
    ports:
      - "8088:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
